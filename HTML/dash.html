<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/dash.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="/JS/dash.JS"></script>
    <title>ZIBA</title>
</head>

<body>

    <!-- Shown until Firebase confirms this visitor is a signed-in, approved
         agent. Nothing below renders until that check passes — a plain URL
         guess at /HTML/dash.html can't skip this. -->
    <div id="authGate" class="auth-gate">
        <div class="auth-gate__spinner"></div>
        <p>Checking your account&hellip;</p>
    </div>

    <!-- AGENT DASHBOARD HTML -->

    <div id="app" class="app" style="display:none;">
        <!-- ==================== AGENT SIDEBAR ==================== -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-brand">
                <div class="logo-container">
                    <img src="/assets/WhatsApp_Image_2026-04-07_at_18.35.51-removebg-preview.png" alt="ZIBA Logo"
                        class="logo" width="200px">

                </div>

                <button class="sidebar-close" id="sidebarClose" aria-label="Close sidebar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>

            <!-- AGENT NAVIGATION -->
            <nav class="sidebar-nav" id="sidebarNav">
                <div class="nav-item active" data-page="dashboard">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7" />
                        <rect x="14" y="3" width="7" height="7" />
                        <rect x="14" y="14" width="7" height="7" />
                        <rect x="3" y="14" width="7" height="7" />
                    </svg>

                    <span>Dashboard</span>
                </div>
                <div class="nav-item" data-page="listings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="8" y1="6" x2="21" y2="6" />
                        <line x1="8" y1="12" x2="21" y2="12" />
                        <line x1="8" y1="18" x2="21" y2="18" />
                        <line x1="3" y1="6" x2="3.01" y2="6" />
                        <line x1="3" y1="12" x2="3.01" y2="12" />
                        <line x1="3" y1="18" x2="3.01" y2="18" />
                    </svg>
                    <span>My Listings</span>
                    <span class="nav-badge" id="agentListingBadge">0</span>
                </div>
                <div class="nav-item" data-page="add-property">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19" />
                        <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                    <span>Add Property</span>
                </div>
                <a href="bulk-upload.html" class="nav-item" style="text-decoration:none;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="17 8 12 3 7 8" />
                        <line x1="12" y1="3" x2="12" y2="15" />
                    </svg>
                    <span>Bulk Upload</span>
                </a>
                <div class="nav-item" data-page="analytics">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="20" x2="18" y2="10" />
                        <line x1="12" y1="20" x2="12" y2="4" />
                        <line x1="6" y1="20" x2="6" y2="14" />
                    </svg>
                    <span>Analytics</span>
                </div>
                <div class="nav-item" data-page="activity">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
                    </svg>
                    <span>Activity</span>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="user-mini">
                    <div class="user-avatar" id="sidebarUserAvatar">A</div>
                    <div class="user-info">
                        <span class="user-name" id="sidebarUserName">Agent</span>
                        <span class="user-role">Agent</span>
                    </div>
                </div>
                <button class="sidebar-signout" id="sidebarSignOut" title="Sign out" aria-label="Sign out">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />

                    </svg>
                </button>

        </aside>

        <!-- ========= MAIN CONTENT AREA ========== -->
        <main class="main">
            <!-- Top Navigation Bar -->
            <header class="topbar">
                <div class="topbar-left">
                    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="3" y1="6" x2="21" y2="6" />
                            <line x1="3" y1="12" x2="21" y2="12" />
                            <line x1="3" y1="18" x2="21" y2="18" />
                        </svg>
                    </button>
                    <div class="breadcrumb" id="breadcrumb">Dashboard</div>
                </div>
                <div class="topbar-right">
                    <button class="topbar-icon" id="notifBtn" aria-label="Notifications">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                            <path d="M13.73 21a2 2 0 0 1-3.46 0" />

                </div>
            </header>

            <!-- Page Content -->
            <div class="content" id="content"></div>
        </main>
    </div>

    <!-- ======== AGENT MODALS ======== -->
    <!-- Add Property Modal -->
    <div class="modal-overlay" id="addPropertyModal">
        <div class="modal modal--large">
            <div class="modal-header">
                <h2 class="modal-title">Add New Property</h2>
                <button class="modal-close" id="closeAddModal" aria-label="Close modal">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
            <form class="modal-body" id="addPropertyForm">
                <div class="form-grid form-grid--2">
                    <div class="form-group">
                        <label class="form-label" for="propTitle">Property Title</label>
                        <input type="text" class="form-input" id="propTitle"
                            placeholder="e.g. Modern Villa in Beverly Hills" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="propPrice">Price</label>
                        <input type="text" class="form-input" id="propPrice" placeholder="e.g. $2,450,000" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="propLocation">Location</label>
                        <input type="text" class="form-input" id="propLocation"
                            placeholder="e.g. 123 Sunset Blvd, Los Angeles, CA" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="propType">Property Type</label>
                        <select class="form-select" id="propType" required>
                            <option value="">Select type</option>
                            <option value="House">House</option>
                            <option value="Apartment">Apartment</option>
                            <option value="Villa">Villa</option>
                            <option value="Condo">Condo</option>
                            <option value="Townhouse">Townhouse</option>
                            <option value="Penthouse">Penthouse</option>
                            <option value="Commercial">Commercial</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="propListingType">Listing Type</label>
                        <select class="form-select" id="propListingType" required>
                            <option value="">Select listing type</option>
                            <option value="Sale">For Sale</option>
                            <option value="Rent">For Rent</option>
                            <option value="Stay">For Stay (short-let)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="propStatus">Status</label>
                        <select class="form-select" id="propStatus" required>
                            <option value="">Select status</option>
                            <option value="Active">Active</option>
                            <option value="Pending">Pending</option>
                            <option value="Sold">Sold</option>
                            <option value="Rented">Rented</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="propBedrooms">Bedrooms</label>
                        <input type="number" class="form-input" id="propBedrooms" min="0" placeholder="e.g. 4" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="propBathrooms">Bathrooms</label>
                        <input type="number" class="form-input" id="propBathrooms" min="0" placeholder="e.g. 3" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="propSize">Size (sqm)</label>
                        <input type="number" class="form-input" id="propSize" min="0" placeholder="e.g. 250" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="propFurnished">Furnished</label>
                        <select class="form-select" id="propFurnished" required>
                            <option value="">Select</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="propServiced">Serviced</label>
                        <select class="form-select" id="propServiced" required>
                            <option value="">Select</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="propDescription">Description</label>
                    <textarea class="form-textarea" id="propDescription" rows="4"
                        placeholder="Describe the property features, amenities, and highlights..." required></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label" for="propImage">Property Photo</label>
                    <div class="photo-upload-zone" id="propImageZone">
                        <input type="file" id="propImage" class="photo-upload-input" accept="image/*">
                        <div class="photo-upload-placeholder" id="propImagePlaceholder">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" />
                                <circle cx="9" cy="9" r="2" />
                                <path d="M21 15l-5-5L5 21" />
                            </svg>
                            <span>Click to upload a photo</span>
                        </div>
                        <img class="photo-upload-preview" id="propImagePreview" style="display:none;" alt="Property preview">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn--secondary" id="cancelAddBtn">Cancel</button>
                    <button type="submit" class="btn btn--primary">Publish Listing</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Property Modal -->
    <div class="modal-overlay" id="editPropertyModal">
        <div class="modal modal--large">
            <div class="modal-header">
                <h2 class="modal-title">Edit Property</h2>
                <button class="modal-close" id="closeEditModal" aria-label="Close modal">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
            <form class="modal-body" id="editPropertyForm">
                <input type="hidden" id="editPropId">
                <div class="form-grid form-grid--2">
                    <div class="form-group">
                        <label class="form-label" for="editPropTitle">Property Title</label>
                        <input type="text" class="form-input" id="editPropTitle" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="editPropPrice">Price</label>
                        <input type="text" class="form-input" id="editPropPrice" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="editPropLocation">Location</label>
                        <input type="text" class="form-input" id="editPropLocation" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="editPropType">Property Type</label>
                        <select class="form-select" id="editPropType" required>
                            <option value="House">House</option>
                            <option value="Apartment">Apartment</option>
                            <option value="Villa">Villa</option>
                            <option value="Condo">Condo</option>
                            <option value="Townhouse">Townhouse</option>
                            <option value="Penthouse">Penthouse</option>
                            <option value="Commercial">Commercial</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="editPropListingType">Listing Type</label>
                        <select class="form-select" id="editPropListingType" required>
                            <option value="Sale">For Sale</option>
                            <option value="Rent">For Rent</option>
                            <option value="Stay">For Stay (short-let)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="editPropStatus">Status</label>
                        <select class="form-select" id="editPropStatus" required>
                            <option value="Active">Active</option>
                            <option value="Pending">Pending</option>
                            <option value="Sold">Sold</option>
                            <option value="Rented">Rented</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="editPropBedrooms">Bedrooms</label>
                        <input type="number" class="form-input" id="editPropBedrooms" min="0" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="editPropBathrooms">Bathrooms</label>
                        <input type="number" class="form-input" id="editPropBathrooms" min="0" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="editPropSize">Size (sqm)</label>
                        <input type="number" class="form-input" id="editPropSize" min="0" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="editPropFurnished">Furnished</label>
                        <select class="form-select" id="editPropFurnished" required>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="editPropServiced">Serviced</label>
                        <select class="form-select" id="editPropServiced" required>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="editPropDescription">Description</label>
                    <textarea class="form-textarea" id="editPropDescription" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label" for="editPropImage">Property Photo</label>
                    <div class="photo-upload-zone" id="editPropImageZone">
                        <input type="file" id="editPropImage" class="photo-upload-input" accept="image/*">
                        <div class="photo-upload-placeholder" id="editPropImagePlaceholder">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" />
                                <circle cx="9" cy="9" r="2" />
                                <path d="M21 15l-5-5L5 21" />
                            </svg>
                            <span>Click to upload a photo</span>
                        </div>
                        <img class="photo-upload-preview" id="editPropImagePreview" style="display:none;" alt="Property preview">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn--secondary" id="cancelEditBtn">Cancel</button>
                    <button type="submit" class="btn btn--primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ======== AUTH GUARD ========
         Confirms this visitor is signed in, is an agent, and is approved
         before revealing #app or initializing the dashboard's data/state.
         Anything else (not signed in, a buyer account, a pending/rejected/
         suspended agent) gets redirected away instead. -->
    <script type="module" src="/JS/Firebase-config.js"></script>
    <script src="/JS/auth.js"></script>
    <script>
        (function () {
            const waitForDb = setInterval(() => {
                if (typeof window.ZibaDB === 'undefined') return;
                clearInterval(waitForDb);

                window.ZibaDB.watchAuthState((user) => {
                    if (!user) {
                        window.location.href = '/HTML/login.html';
                        return;
                    }

                    window.ZibaDB.getUserProfile(user.uid).then((profile) => {
                        if (!profile || profile.role !== 'agent') {
                            // A buyer account trying to view an agent page
                            window.location.href = '/HTML/index.html';
                        } else if (profile.agentStatus !== 'approved') {
                            // Agent, but not approved (yet, rejected, or suspended)
                            window.location.href = '/HTML/pending.html';
                        } else {
                            document.getElementById('authGate').style.display = 'none';
                            document.getElementById('app').style.display = 'flex';
                            window.ZibaInitDashboard({ uid: user.uid, ...profile });
                        }
                    });
                });
            }, 100);
        })();
    </script>

</body>

</html>

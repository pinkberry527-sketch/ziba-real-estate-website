<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Queue | Ziba Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/CSS/auth.css">
    <link rel="icon" type="image/png" href="../assets/logos/favicon.png">
    <meta name="robots" content="noindex, nofollow">
</head>
<body class="auth-v2-body">

    <a class="brand-mark" href="index.html">
        <img src="../assets/logo.jpeg" alt="Ziba Real Estate">
        <span>ZIBA</span>
    </a>

    <!-- ===== Login gate (shown until Firebase confirms an admin session) ===== -->
    <div class="auth-container" id="loginGate" style="min-height: auto; padding: 0;">
        <div class="auth-card" style="max-width: 420px;">
            <h2 class="auth-title">Reviewer sign in</h2>
            <p class="auth-subtitle">Only approved reviewer accounts can access this page.</p>

            <form id="adminLoginForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="adminEmail" class="form-label">Email address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="adminEmail" class="form-input" placeholder="you@email.com" autocomplete="username" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="adminPassword" class="form-label">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="adminPassword" class="form-input" placeholder="Enter your password" autocomplete="current-password" required>
                    </div>
                </div>
                <button type="submit" class="auth-button"><span>Sign in</span></button>
            </form>
        </div>
    </div>

    <!-- ===== Queue (shown once signed in) ===== -->
    <div class="admin-shell" id="queueShell" style="display:none;">
        <div class="admin-header">
            <div>
                <h2 class="auth-title" style="text-align:left; margin-bottom:4px;">Review queue</h2>
                <p class="auth-subtitle" style="text-align:left; margin-bottom:0;">Signed in as <strong id="adminEmailLabel"></strong></p>
            </div>
            <button type="button" class="auth-button-secondary" style="width:auto; padding: 10px 20px;" onclick="handleAdminSignOut()">
                <i class="fas fa-sign-out-alt" style="margin-right:8px;"></i>Sign out
            </button>
        </div>

        <div id="queueList"></div>
        <div id="queueEmpty" class="queue-empty" style="display:none;">
            <i class="fas fa-circle-check" style="font-size: var(--text-size-2xl); color: var(--success-color); margin-bottom: var(--spacing-md);"></i>
            <p>Nothing waiting on review right now.</p>
        </div>
    </div>

    <script type="module" src="/JS/firebase-config.js"></script>
    <script src="/JS/auth.js"></script>
    <script>
        let unsubscribeQueue = null;

        function waitForDb(callback) {
            const check = setInterval(() => {
                if (typeof window.ZibaDB === 'undefined') return;
                clearInterval(check);
                callback();
            }, 100);
        }

        function renderQueue(apps) {
            const list = document.getElementById('queueList');
            const empty = document.getElementById('queueEmpty');

            if (!apps.length) {
                list.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            list.innerHTML = apps.map(app => `
                <div class="app-card" data-id="${app.id}">
                    <div class="app-card-header">
                        <div>
                            <h3>${escapeHtml(app.fullName || 'Unknown applicant')}</h3>
                            <p>${escapeHtml(app.email || '')} &middot; ${escapeHtml(app.businessName || '')}</p>
                        </div>
                        <span class="status-badge">Pending</span>
                    </div>
                    <p class="app-card-bio">${escapeHtml(app.bio || 'No bio provided')}</p>
                    <div class="app-card-meta">
                        <span>Ref: ${escapeHtml(app.referenceId || '--')}</span>
                        <span>Submitted: ${escapeHtml(app.submittedAt || '--')}</span>
                    </div>
                    <div class="app-card-actions">
                        <button type="button" class="auth-button" style="background:var(--success-color); box-shadow:none;" onclick="reviewApplication('${app.id}','approved',this)">
                            <i class="fas fa-check" style="margin-right:6px;"></i>Approve
                        </button>
                        <button type="button" class="auth-button-secondary" style="border-color:var(--error-color); color:var(--error-color);" onclick="reviewApplication('${app.id}','rejected',this)">
                            <i class="fas fa-xmark" style="margin-right:6px;"></i>Reject
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function reviewApplication(id, status, btn) {
            const card = btn.closest('.app-card');
            card.style.opacity = '0.5';
            card.querySelectorAll('button').forEach(b => b.disabled = true);

            const email = document.getElementById('adminEmailLabel').textContent;
            window.ZibaDB.setApplicationStatus(id, status, email)
                .then(() => Auth.showToast(status === 'approved' ? 'Applicant approved' : 'Application rejected', 'success'))
                .catch((err) => {
                    console.error('Review failed:', err);
                    Auth.showToast('Could not update — try again', 'error');
                    card.style.opacity = '1';
                    card.querySelectorAll('button').forEach(b => b.disabled = false);
                });
            // The queue re-renders itself automatically via the live listener
            // once Firestore confirms the status change (the card just
            // disappears from "pending" on its own).
        }

        function showQueue(user) {
            document.getElementById('loginGate').style.display = 'none';
            document.getElementById('queueShell').style.display = 'block';
            document.getElementById('adminEmailLabel').textContent = user.email;

            if (unsubscribeQueue) unsubscribeQueue();
            unsubscribeQueue = window.ZibaDB.watchPendingApplications(renderQueue);
        }

        function showLoginGate() {
            document.getElementById('loginGate').style.display = 'flex';
            document.getElementById('queueShell').style.display = 'none';
            if (unsubscribeQueue) { unsubscribeQueue(); unsubscribeQueue = null; }
        }

        function handleAdminSignOut() {
            window.ZibaDB.adminSignOut();
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('adminEmail').value.trim();
                const password = document.getElementById('adminPassword').value;
                const btn = e.target.querySelector('.auth-button');
                btn.classList.add('loading');
                btn.disabled = true;

                window.ZibaDB.adminSignIn(email, password)
                    .catch((err) => {
                        console.error('Admin sign-in failed:', err);
                        Auth.showToast('Sign-in failed — check your email and password', 'error');
                    })
                    .finally(() => {
                        btn.classList.remove('loading');
                        btn.disabled = false;
                    });
            });

            waitForDb(() => {
                window.ZibaDB.watchAdminAuth((user) => {
                    if (user) showQueue(user);
                    else showLoginGate();
                });
            });
        });
    </script>
</body>
</html>

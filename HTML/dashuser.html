<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/dash.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="/JS/dashuser.JS"></script>
    <title>ZIBA</title>

</head>

<body>
    <!-- ============================================================ -->
    <!-- USER DASHBOARD HTML -->
    <!-- ============================================================ -->

    <div id="app" class="app">
        <!-- ==================== USER SIDEBAR ==================== -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-brand">
                <div class="logo-container">
                    <a href="/HTML/lp.html"><img src="/assets/WhatsApp_Image_2026-04-07_at_18.35.51-removebg-preview.png" alt="ZIBA Logo"
                        class="logo" width="200px"></a>
                    
                    <div class="logo-placeholder">
                        
                            <path d="M24 4L4 20V44H18V32H30V44H44V20L24 4Z" fill="var(--primary-color)" />
                            <path d="M24 4L4 20V44H18V32H30V44H44V20L24 4Z" stroke="var(--accent-color)"
                                stroke-width="2" />
                        </svg>
                    </div>
                   
                </div>
                <button class="sidebar-close" id="sidebarClose" aria-label="Close sidebar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>

            <!-- USER NAVIGATION -->
            <nav class="sidebar-nav" id="sidebarNav">
                <div class="nav-item active" data-page="dashboard">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7" />
                        <rect x="14" y="3" width="7" height="7" />
                        <rect x="14" y="14" width="7" height="7" />
                        <rect x="3" y="14" width="7" height="7" />
                    </svg>
                    <span>Dashboard</span>
                </div>
                <div class="nav-item" data-page="browse">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    <span>Browse Properties</span>
                </div>
                <div class="nav-item" data-page="saved">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path
                            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
                    </svg>
                    <span>Saved</span>
                    <span class="nav-badge" id="userSavedBadge">0</span>
                </div>
                <div class="nav-item" data-page="recent">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                    <span>Recent Views</span>
                </div>
                <div class="nav-item" data-page="inquiries">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                    </svg>
                    <span>My Inquiries</span>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="user-mini">
                    <div class="user-avatar">TM</div>
                    <div class="user-info">
                        <span class="user-name">Tobi Moffy</span>
                        <span class="user-role">User</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- ==================== MAIN CONTENT AREA ==================== -->
        <main class="main">
            <!-- Top Navigation Bar -->
            <header class="topbar">
                <div class="topbar-left">
                    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="3" y1="6" x2="21" y2="6" />
                            <line x1="3" y1="12" x2="21" y2="12" />
                            <line x1="3" y1="18" x2="21" y2="18" />
                        </svg>
                    </button>
                    <div class="breadcrumb" id="breadcrumb">Dashboard</div>
                </div>
                <div class="topbar-right">
                    <button class="topbar-icon" id="notifBtn" aria-label="Notifications">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                        </svg>
                        <span class="notif-badge">0</span>
                    </button>
                </div>
            </header>

            <!-- Page Content -->
            <div class="content" id="content"></div>
        </main>
    </div>

    <!-- ==================== USER MODALS ==================== -->
    <!-- Property Details Modal -->
    <div class="modal-overlay" id="propertyDetailsModal">
        <div class="modal modal--xl">
            <div class="modal-header">
                <h2 class="modal-title" id="detailTitle">Property Details</h2>
                <button class="modal-close" id="closeDetailModal" aria-label="Close modal">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
            <div class="modal-body" id="detailBody"></div>
        </div>
    </div>

    <!-- Inquiry Modal -->
    <div class="modal-overlay" id="inquiryModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Send Inquiry</h2>
                <button class="modal-close" id="closeInquiryModal" aria-label="Close modal">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
            <form class="modal-body" id="inquiryForm">
                <input type="hidden" id="inquiryPropId">
                <div class="form-group">
                    <label class="form-label" for="inquiryName">Full Name</label>
                    <input type="text" class="form-input" id="inquiryName" placeholder="Your full name" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="inquiryEmail">Email</label>
                    <input type="email" class="form-input" id="inquiryEmail" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="inquiryPhone">Phone</label>
                    <input type="tel" class="form-input" id="inquiryPhone" placeholder="+1 (555) 000-0000">
                </div>
                <div class="form-group">
                    <label class="form-label" for="inquiryMessage">Message</label>
                    <textarea class="form-textarea" id="inquiryMessage" rows="4"
                        placeholder="I am interested in this property and would like to schedule a viewing..."
                        required></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn--secondary" id="cancelInquiryBtn">Cancel</button>
                    <button type="submit" class="btn btn--primary">Send Inquiry</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Ziba Real Estate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../CSS/auth.css">
    <link rel="icon" type="image/png" href="../assets/logos/logo.jpeg">
</head>

<body>
    <!-- Background Elements -->
    <div class="auth-background"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <!-- Main Container -->
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo Section -->
            <div class="auth-logo">
                <a href="index.html"><img src="../assets/logo.jpeg" alt="Ziba Real Estate"></a>
                <h1>ZIBA</h1>
                <p>Premium Real Estate</p>
            </div>

            <!-- Title -->
            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Sign in to access your account</p>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form" novalidate>

                <!-- Email -->
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email"
                            autocomplete="email" required>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" class="form-input"
                            placeholder="Enter your password" autocomplete="current-password" required>
                        <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Form Options: Remember Me & Forgot Password -->
                <div class="form-options">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="rememberMe" name="rememberMe" class="checkbox-input">
                        <span class="checkbox-label">Remember me</span>
                    </label>
                    <a href="#" class="auth-link"
                        onclick="event.preventDefault(); Auth.showToast('Password reset feature coming soon', 'info');">
                        Forgot password?
                    </a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="auth-button">
                    <span>Sign In</span>
                    <i class="fas fa-arrow-right" style="margin-left: 8px;"></i>
                </button>

            </form>

            <!-- Footer -->
            <div class="auth-footer">
                <p class="auth-footer-text">
                    Don't have an account?
                    <a href="register.html" class="auth-link">Create one</a>
                </p>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/auth.js"></script>
</body>

</html>

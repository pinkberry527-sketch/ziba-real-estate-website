<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Verification | Ziba Real Estate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../CSS/auth.css">
    <link rel="icon" type="image/png" href="../assets/logos/favicon.png">
</head>

<body>
    <!-- Background Elements -->
    <div class="auth-background"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <!-- Main Container -->
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo Section -->
            <div class="auth-logo">
                <a href="index.html"><img src="../assets/logo.jpeg" alt="Ziba Real Estate"></a>
                <h1>ZIBA</h1>
                <p>Premium Real Estate</p>
            </div>

            <!-- Step Indicator -->
            <div class="step-indicator">
                <div class="step completed">
                    <div class="step-number"><i class="fas fa-check"></i></div>
                    <span class="step-label">Account</span>
                </div>
                <div class="step-line"></div>
                <div class="step active">
                    <div class="step-number">2</div>
                    <span class="step-label">Verify</span>
                </div>
                <div class="step-line"></div>
                <div class="step">
                    <div class="step-number">3</div>
                    <span class="step-label">Review</span>
                </div>
            </div>

            <!-- Title -->
            <h2 class="auth-title">Agent Verification</h2>
            <p class="auth-subtitle">Complete your profile to start listing properties</p>

            <!-- Verification Form -->
            <form id="verifyForm" class="auth-form" novalidate>

                <!-- Profile Photo Upload -->
                <div class="form-group">
                    <label class="form-label">Profile Photo</label>
                    <div class="upload-zone" data-upload-type="profile">
                        <input type="file" id="profilePhoto" name="profilePhoto" class="upload-input" accept="image/*">
                        <i class="fas fa-camera upload-icon"></i>
                        <p class="upload-text">Drop your photo here or click to browse</p>
                        <p class="upload-hint">JPG, PNG or WebP (max 5MB)</p>
                    </div>
                </div>

                <!-- Business Name -->
                <div class="form-group">
                    <label for="businessName" class="form-label">Business Name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-building input-icon"></i>
                        <input type="text" id="businessName" name="businessName" class="form-input"
                            placeholder="Your company name" autocomplete="organization" required>
                    </div>
                </div>

                <!-- ID Document Upload -->
                <div class="form-group">
                    <label class="form-label">ID Verification Document</label>
                    <div class="upload-zone" data-upload-type="document">
                        <input type="file" id="idDocument" name="idDocument" class="upload-input"
                            accept=".pdf,.jpg,.jpeg,.png">
                        <i class="fas fa-id-card upload-icon"></i>
                        <p class="upload-text">Upload your ID or business license</p>
                        <p class="upload-hint">PDF, JPG, or PNG (max 5MB)</p>
                    </div>
                </div>

                <!-- Bio Textarea -->
                <div class="form-group">
                    <label for="bio" class="form-label">Professional Bio</label>
                    <textarea id="bio" name="bio" class="form-textarea"
                        placeholder="Tell us about your experience, specialties, and what makes you unique..."
                        rows="4"></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="auth-button">
                    <span>Submit for Review</span>
                    <i class="fas fa-paper-plane" style="margin-left: 8px;"></i>
                </button>

            </form>

            <!-- Footer -->
            <div class="auth-footer">
                <p class="auth-footer-text">
                    <a href="register.html" class="auth-link">
                        <i class="fas fa-arrow-left" style="margin-right: 6px;"></i>Back to registration
                    </a>
                </p>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/auth.js"></script>
</body>

</html>
